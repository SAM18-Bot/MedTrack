{% extends 'base.html' %}
{% block title %}Invoices{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>My Invoices</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Invoice ID</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for inv in invoices %}
                <tr>
                    <td>{{ inv.InvoiceID }}</td>
                    <td>{{ inv.CreatedAt }}</td>
                    <td>${{ inv.Amount }}</td>
                    <td><span class="badge bg-{% if inv.Status == 'Paid' %}success{% else %}warning{% endif %}">{{ inv.Status }}</span></td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center">No invoices found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Create an Account &mdash; MedTrack Clinical Portal{% endblock %}
{% block public_content %}
<div class="mt-auth-shell">
  <div class="mt-auth-card" style="max-width: 460px;">
    <div class="mt-brand" style="justify-content:center; margin-bottom: 12px;">
      <span class="mt-brand-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
          <path d="M12 4v16m-8-8h16"/>
        </svg>
      </span>
      <span>MedTrack</span>
    </div>

    <div class="mt-auth-security-badge">
      <i class="bi bi-shield-check"></i> Encrypted Patient & Provider Registration
    </div>

    <p style="color: var(--mt-ink-soft); font-size: 0.92rem; margin: 0 0 22px;">
      Create your verified MedTrack account in seconds.
    </p>

    <form method="POST" action="{{ url_for('auth.signup') }}" class="mt-auth-form" style="text-align: left;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="name" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-person me-1 text-muted"></i> Full Name
        </label>
        <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required autofocus placeholder="Dr. Jane Doe or Alex Smith">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-envelope me-1 text-muted"></i> Email address
        </label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" autocomplete="username" required placeholder="name@example.com">
      </div>

      <div class="mb-3">
        <label for="role" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-person-badge me-1 text-muted"></i> Registering as
        </label>
        <select class="form-select" id="role" name="role" onchange="toggleSpecialization(this.value)">
          <option value="patient" {% if role != 'doctor' %}selected{% endif %}>Patient (Care Recipient)</option>
          <option value="doctor" {% if role == 'doctor' %}selected{% endif %}>Medical Doctor / Specialist</option>
        </select>
      </div>

      <div class="mb-3" id="spec-group" style="display: {% if role == 'doctor' %}block{% else %}none{% endif %};">
        <label for="specialization" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-hospital me-1 text-muted"></i> Medical Specialization
        </label>
        <input type="text" class="form-control" id="specialization" name="specialization" value="{{ specialization or '' }}" placeholder="e.g. Cardiology, Dermatology, General Physician">
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-telephone me-1 text-muted"></i> Phone number
        </label>
        <input type="tel" class="form-control" id="phone" name="phone" value="{{ phone or '' }}" placeholder="+1234567890">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-lock me-1 text-muted"></i> Password
        </label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required placeholder="At least 8 characters">
      </div>

      <div class="mb-3">
        <label for="confirm_password" class="form-label" style="font-size:0.85rem; font-weight:600; color:var(--mt-ink);">
          <i class="bi bi-lock-fill me-1 text-muted"></i> Confirm Password
        </label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" required placeholder="Re-enter password">
      </div>

      <button type="submit" class="mt-btn mt-btn-primary w-100" style="justify-content: center; padding: 12px;">
        <i class="bi bi-person-plus-fill"></i> Create Account
      </button>
    </form>

    <script>
      function toggleSpecialization(roleVal) {
        var group = document.getElementById('spec-group');
        if (roleVal === 'doctor') {
          group.style.display = 'block';
        } else {
          group.style.display = 'none';
        }
      }
    </script>

    <div style="margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--mt-line); font-size: 0.88rem;">
      <span style="color: var(--mt-ink-soft);">Already have an account?</span>
      <a href="{{ url_for('auth.login') }}" style="color: var(--mt-teal-700); font-weight: 600; text-decoration: none; margin-left: 4px;">Sign in</a>
    </div>

    <a href="{{ url_for('public.index') }}" style="display:inline-flex; align-items:center; gap:6px; margin-top: 14px; font-size: 0.84rem; color: var(--mt-teal-700); font-weight:600; text-decoration: none;">
      <i class="bi bi-arrow-left"></i> Back to home
    </a>
  </div>
</div>
{% endblock %}
